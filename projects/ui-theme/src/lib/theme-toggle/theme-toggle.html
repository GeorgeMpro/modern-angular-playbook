<button class="theme-toggle-btn" (click)="onToggle()" aria-label="Toggle theme">
      <span #rotator
            class="rotate-target"
            [class.rotate-cw]="rotated()"
            [class.rotate-ccw]="!rotated()">
        <svg [lucideIcon]="theme.isDark() ? sunIcon : moonIcon" class="theme-icon"/>
      </span>
</button>
