<h1 class="contact-title">Get in Touch</h1>
<p class="contact-intro">Have a question or want to work together? Send me a message.</p>

@if (submitted()) {
  <div class="success">
    <p>Thanks! I'll be in touch.</p>
    <button type="button" (click)="reset()">Send another message</button>
  </div>
} @else {
  <form (submit)="onSubmit($event)">
    <label for="name">Name</label>
    <input type="text" id="name" [formField]="contactForm.name"/>
    <label for="email">Email</label>
    <input type="email" id="email" [formField]="contactForm.email"/>
    <label for="message">Message</label>
    <textarea id="message" [formField]="contactForm.message" rows="5"></textarea>

    <button type="submit" [disabled]="!hasUnsavedChanges()">Send Message</button>
  </form>
}
