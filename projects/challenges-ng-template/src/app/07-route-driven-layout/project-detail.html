<a routerLink="../" class="back-link">← Back to Projects</a>

@let prod = product();

<article class="product-card">
  <header class="product-card__header">
    <span class="product-card__category">{{ prod.category }}</span>
    <h1 class="product-card__name">{{ prod.name }}</h1>
    <p class="product-card__brand">{{ prod.brand }}</p>
  </header>

  <dl class="product-card__stats">
    <div class="product-card__stat">
      <dt>Price</dt>
      <dd>${{ prod.price }}</dd>
    </div>
    <div class="product-card__stat">
      <dt>In Stock</dt>
      <dd>{{ prod.stock }} units</dd>
    </div>
    <div class="product-card__stat">
      <dt>ID</dt>
      <dd>#{{ prod.id }}</dd>
    </div>
  </dl>
</article>
