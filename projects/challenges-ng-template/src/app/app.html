<header class="main-header">
  <div class="header-content">
    <nav class="nav">
      @for (route of navRoutes; track route.title) {
        <a [routerLink]="route.path" routerLinkActive="active" class="nav-link">
          {{ route.title }}
        </a>
      }
    </nav>

    <lib-theme-toggle/>
  </div>
</header>

<main>
  <router-outlet/>
</main>
