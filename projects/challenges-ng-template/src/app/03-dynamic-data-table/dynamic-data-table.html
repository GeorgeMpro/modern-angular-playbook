<ng-template #usersRows
             [typedRow]="users()"
             let-item
             let-i="index">
  <td>{{ i + 1 }}</td>
  <td>{{ item.name }}</td>
  <td>{{ item.role }}</td>
  <td>{{ item.status }}</td>
</ng-template>

<ng-template #productsRows
             [typedRow]="products()"
             let-item
             let-i="index">
  <td>{{ i + 1 }}</td>
  <td>{{ item.name }}</td>
  <td>{{ item.brand }}</td>
  <td>{{ item.category }}</td>
  <td>{{ item.price }}</td>
  <td>{{ item.stock }}</td>
</ng-template>

<div class="tables-wrapper">
  <app-data-table title="user table"
                  [columnHeaders]="usersHeaders"
                  [data]="users()"
                  [rowTemplate]="usersRows"/>

  <app-data-table title="product table"
                  [columnHeaders]="productHeaders"
                  [data]="products()"
                  [rowTemplate]="productsRows"/>
</div>
