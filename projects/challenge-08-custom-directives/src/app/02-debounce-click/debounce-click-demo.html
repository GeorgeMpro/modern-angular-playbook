<app-demo-shell title="debounce click">
  <div ngProjectAs="[preview]" class="preview-box">
    <button appDebounceClick
            (btnClick)="onDebounceClick()"
            [timeDelay]="customDelay"
            class="btn-trigger">
      Click Me Fast
    </button>
    <p class="counter">Triggered: {{ clickCount() }} times.</p>

    <div class="log-view">
      @for (entry of log().slice(0, 1); track $index) {
        <p class="log-entry">{{ entry }}</p>
      }
    </div>
  </div>
</app-demo-shell>
