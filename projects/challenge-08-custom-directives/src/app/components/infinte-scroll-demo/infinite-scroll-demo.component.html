<app-demo-shell title="infinite scroll">

  <div
    appInfiniteScroll
    (scrollEnd)="onScrollEnd()"
    ngProjectAs="[preview]"
    class="scroll-container">
    @if (!error()) {
      <table>
        <thead>
        <th>Id</th>
        <th>Title</th>
        <th>Category</th>
        <th>Price</th>
        </thead>
        <tbody>
          @for (prod of products(); track prod.id) {
            <tr>
              <td>{{ prod.id }}</td>
              <td>{{ prod.title }}</td>
              <td>{{ prod.category }}</td>
              <td>{{ prod.price }}</td>
            </tr>
          } @empty {
            <p>No Products</p>
          }
        </tbody>
      </table>
    } @else {
      <p>{{ error() }}</p>
    }
  </div>
</app-demo-shell>
