<div class="display-container">
  <section>
    <h1>Debounce Click</h1>
    <div class="preview-box">
      <button appDebounceClick
              (btnClick)="onDebounceClick()"
              [timeDelay]="500"
              class="btn-trigger">
        Click Me Fast
      </button>
      <p class="counter">Triggered: {{ clickCount() }} times.</p>

      <div class="log-view">
        @for (entry of log().slice(0, 1); track $index) {
          <p class="log-entry">{{ entry }}</p>
        }
      </div>
    </div>
  </section>

  <section>
    <h1>Highlight Directive</h1>
    <h2>Pick a Highlight Color</h2>
    <div class="color-picker">
      @for (c of colorsDisplay; track c.label) {
        <label class="color-option">
          <input type="radio" name="colors" (click)="color.set(c.color)"/>
          <span>{{ c.label | titlecase }}</span>
        </label>
      }
    </div>
    <div class="preview-box">
      <p class="highlight-text"
         [appHighlight]="color()"
         defaultColor="violet">
        Hover over me to see the highlight!
      </p>
    </div>
  </section>
</div>
